name: Quality and Civil 3D export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: Windows
            os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python for independent DXF verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: npm ci
      - name: Install the independent DXF reader
        run: python -m pip install ezdxf==1.4.3
      - name: Typecheck, unit tests, export regression tests, and production build
        run: npm run check
      - name: Verify generated DXF geometry with an independent reader
        run: npm run test:interop
        env:
          PYTHON: python
      - name: Install browser test runtime
        run: npx playwright install chromium
      - name: Verify project, drawing, persistence, and desktop workflows
        run: npm run test:e2e
      - name: Package native application
        run: npm run package -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Launch packaged macOS application
        if: runner.os == 'macOS'
        run: npm run test:e2e -- tests/desktop.spec.ts
        env:
          LOTGRADE_EXECUTABLE: ${{ github.workspace }}/release/LotGrade-${{ matrix.platform }}-${{ matrix.arch }}/LotGrade.app/Contents/MacOS/LotGrade
      - name: Launch packaged Windows application
        if: runner.os == 'Windows'
        run: npm run test:e2e -- tests/desktop.spec.ts
        env:
          LOTGRADE_EXECUTABLE: ${{ github.workspace }}/release/LotGrade-${{ matrix.platform }}-${{ matrix.arch }}/LotGrade.exe
      - name: Archive macOS application with bundle permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "release/LotGrade-${{ matrix.platform }}-${{ matrix.arch }}/LotGrade.app" "release/LotGrade-v0-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Archive Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/LotGrade-${{ matrix.platform }}-${{ matrix.arch }}" -DestinationPath "release/LotGrade-v0-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve the verified application bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LotGrade-v0-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/LotGrade-v0-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
